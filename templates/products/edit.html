{{define "content"}}
{{if .Product}}
<section class="form-page listing-page">
  <div class="form-aside listing-aside"><p class="eyebrow">ปรับปรุงรายละเอียดสินค้า</p><h1>ของชิ้นเดิม<br><em>ยังน่าสนใจ</em></h1><p>ตรวจสอบรายละเอียดให้ตรงกับสินค้าจริง คุณจะเปลี่ยนรูปประกาศหรือใช้รูปเดิมก็ได้</p><div class="aside-rule"></div><span>แก้ไขประกาศขาย</span></div>
  <div class="form-panel"><p class="eyebrow">ประกาศขายของคุณ</p><h2>แก้ไขสินค้า</h2>
    <form method="post" action="/products/{{.Product.ID}}" enctype="multipart/form-data" class="stack-form">
      {{.CSRFField}}
      <label for="title">ชื่อสินค้า</label><input id="title" name="title" required minlength="3" maxlength="120" value="{{.Product.Title}}">
      <label for="description">รายละเอียดสินค้า</label><textarea id="description" name="description" required minlength="10" maxlength="2000" rows="5">{{.Product.Description}}</textarea>
      <div class="form-row"><div><label for="price">ราคา (฿)</label><input id="price" name="price" type="number" min="0.01" max="1000000" step="0.01" required value="{{decimal .Product.PriceCents}}"></div><div><label for="category">หมวดหมู่</label><select id="category" name="category" required>{{range .Categories}}<option value="{{.}}" {{if eq $.Product.Category .}}selected{{end}}>{{categoryLabel .}}</option>{{end}}</select></div></div>
      <label for="condition">สภาพสินค้า</label><select id="condition" name="condition" required><option value="Like new" {{if eq .Product.Condition "Like new"}}selected{{end}}>เหมือนใหม่</option><option value="Very good" {{if eq .Product.Condition "Very good"}}selected{{end}}>ดีมาก</option><option value="Good" {{if eq .Product.Condition "Good"}}selected{{end}}>ดี</option><option value="Well loved" {{if eq .Product.Condition "Well loved"}}selected{{end}}>ผ่านการใช้งาน</option></select>
      <label for="image">เปลี่ยนรูปสินค้า <span class="label-hint">JPEG หรือ PNG ขนาดไม่เกิน 5 MB</span></label><input id="image" name="image" type="file" accept="image/jpeg,image/png">
      <button class="button button-dark button-wide" type="submit">บันทึกการแก้ไข <span aria-hidden="true">↗</span></button>
    </form>
    <form method="post" action="/products/{{.Product.ID}}/delete" class="delete-form">{{.CSRFField}}<button class="text-button danger-text" type="submit">ลบประกาศขายนี้</button></form>
  </div>
</section>
{{end}}
{{end}}
