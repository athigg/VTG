{{define "content"}}
<section class="form-page auth-page">
  <div class="form-aside register-aside"><p class="eyebrow">ตลาดของดีที่มีเรื่องราว</p><h1>ของมีคุณค่า<br>ได้พบกับ<br><em>เจ้าของคนใหม่</em></h1><p>สมัครสมาชิกเพื่อลงขายสินค้า เลือกชมของที่สนใจ และส่งต่อของดีให้ได้ไปต่อ</p><div class="aside-rule"></div><span>ซื้อขายอย่างใส่ใจ</span></div>
  <div class="form-panel"><p class="eyebrow">ร่วมเป็นส่วนหนึ่งของตลาด</p><h2>สมัครสมาชิก</h2>
    <form method="post" action="/register" class="stack-form">
      {{.CSRFField}}
      <label for="name">ชื่อที่ใช้แสดง</label><input id="name" name="name" required minlength="2" maxlength="100" autocomplete="name">
      <label for="email">อีเมล</label><input id="email" name="email" type="email" required maxlength="255" autocomplete="email">
      <label for="password">รหัสผ่าน <span class="label-hint">อย่างน้อย 10 ตัวอักษร</span></label><input id="password" name="password" type="password" required minlength="10" maxlength="72" autocomplete="new-password">
      <button class="button button-dark button-wide" type="submit">สร้างบัญชี <span aria-hidden="true">↗</span></button>
    </form>
    <p class="form-foot">เป็นสมาชิกอยู่แล้ว? <a href="/login">เข้าสู่ระบบ</a></p>
  </div>
</section>
{{end}}
